<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendi+ - Login e Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
        }

        .welcome-panel {
            flex: 1;
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome-panel .logo { font-size: 2.8rem; font-weight: 800; }
        .welcome-panel .logo span { color: #ffcc00; }
        .welcome-panel .subtitle { margin-top: 10px; opacity: 0.9; }

        .welcome-features {
            margin-top: 30px;
            text-align: left;
        }

        .welcome-features div {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .welcome-features i { color: #ffcc00; font-size: 1.2rem; }

        .form-panel { flex: 1; padding: 40px; }

        .form-toggle {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .toggle-btn {
            padding: 15px;
            flex: 1;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #777;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            color: #2575fc;
            border-bottom: 3px solid #2575fc;
        }

        .form { display: none; }
        .form.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #2575fc;
            outline: none;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 42px;
            color: #6a11cb;
            font-size: 1.2rem;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .options a { color: #2575fc; text-decoration: none; font-weight: 600; }
        .options a:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(37,117,252,0.4);
        }

        .separator {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .separator::before,
        .separator::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #ddd;
        }

        .separator::before { left: 0; }
        .separator::after { right: 0; }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .social-btn:hover { transform: translateY(-3px); }
        .social-btn.facebook { background: #3b5998; }
        .social-btn.google { background: #dd4b39; }
        .social-btn.apple { background: #000; }

        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #2575fc; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .login-container { flex-direction: column; max-width: 450px; }
            .welcome-panel { display: none; }
            .form-panel { padding: 30px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="welcome-panel">
            <div class="logo">Aprende<span>+</span></div>
            <div class="subtitle">Sua jornada de conhecimento começa aqui</div>
            <div class="welcome-features">
                <div><i class="fas fa-check-circle"></i> Acesso a recursos de estudo</div>
                <div><i class="fas fa-check-circle"></i> Acompanhamento de progresso</div>
                <div><i class="fas fa-check-circle"></i> Sistema de gamificação</div>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-toggle">
                <div class="toggle-btn active" onclick="showForm('login')">Login</div>
                <div class="toggle-btn" onclick="showForm('signup')">Cadastro</div>
            </div>

<form id="login-form" class="form active"
      action="login.php" method="POST">

    <div class="input-group">
        <label for="login-email">E-mail</label>
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" id="login-email" placeholder="Digite seu e-mail" required>
    </div>

    <div class="input-group">
        <label for="login-password">Senha</label>
        <i class="fas fa-lock"></i>
        <input type="password" name="senha" id="login-password" placeholder="Digite sua senha" required>
    </div>

    <div class="options">
        <label>
            <input type="checkbox">
            Lembrar-me
        </label>

        <a href="#">Esqueceu a senha?</a>
    </div>

    <button type="submit" class="btn-login">
        Entrar
    </button>

    <div class="separator">ou continue com</div>

    <div class="social-login">
        <div class="social-btn facebook">
            <i class="fab fa-facebook-f"></i>
        </div>

        <div class="social-btn google">
            <i class="fab fa-google"></i>
        </div>

        <div class="social-btn apple">
            <i class="fab fa-apple"></i>
        </div>
    </div>

    <div class="login-link">
        Não tem uma conta?
        <a href="#" onclick="showForm('signup'); return false;">
            Cadastre-se
        </a>
    </div>

</form>


<!-- FORMULÁRIO DE CADASTRO -->
<form id="signup-form" class="form"
      action="cadastro.php" method="POST">

    <input type="hidden" name="acao" value="cadastro">

    <div class="input-group">
        <label for="signup-name">Nome</label>
        <i class="fas fa-user"></i>
        <input type="text" name="nome" id="signup-name" placeholder="Digite seu nome" required >
    </div>

    <div class="input-group">
        <label for="signup-email">E-mail</label>
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" id="signup-email" placeholder="Digite seu e-mail" required >
    </div>

    <div class="input-group">
        <label for="signup-password">Senha</label>
        <i class="fas fa-lock"></i>
        <input type="password" name="senha" id="signup-password" placeholder="Crie uma senha" required>
    </div>

    <div class="input-group">
        <label for="signup-confirm">Confirmar senha</label>
        <i class="fas fa-lock"></i>
        <input type="password" name="confirmar_senha" id="signup-confirm" placeholder="Repita sua senha" required>
    </div>

    <button type="submit" class="btn-login">
        Criar Conta
    </button>

    <div class="login-link">
        Já tem uma conta?
        <a href="#" onclick="showForm('login'); return false;">
            Faça login
        </a>
    </div>

</form>


<script>

    function showForm(type) {

     
        document.querySelectorAll('.form').forEach(form => {
            form.classList.remove('active');
        });

        document.querySelectorAll('.toggle-btn').forEach(button => {
            button.classList.remove('active');
        });

        if (type === 'login') {
            document.getElementById('login-form')
                .classList.add('active');
            document.querySelectorAll('.toggle-btn')[0]
                ?.classList.add('active');

        } else if (type === 'signup') {

            document.getElementById('signup-form')
                .classList.add('active');

            document.querySelectorAll('.toggle-btn')[1]
                ?.classList.add('active');
        }
    }

</script>

</body>
</html>
